name: Release

# Push a tag like v0.2.0 to build Tidy.app and publish it as a GitHub release.
# With these repository secrets set, the app is signed with Developer ID and notarized, so it opens
# without a Gatekeeper warning; without them it's signed ad hoc (right-click > Open the first time):
#   MACOS_CERTIFICATE        base64 of a Developer ID Application .p12
#   MACOS_CERTIFICATE_PASSWORD
#   APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD   (an app-specific password for notarytool)
# And APTABASE_APP_KEY (e.g. A-EU-1234567890) turns on the anonymous telemetry in released builds.
# Windows builds are signed through SignPath (free for open source, see README "Code signing
# policy") once these are set; without them they're published unsigned:
#   SIGNPATH_API_TOKEN (secret), SIGNPATH_ORGANIZATION_ID (variable)
#   SignPath project "tidy" with signing policy "release-signing" and artifact configurations
#   "exe" (a zip holding Tidy.exe) and "installer" (a zip holding the setup .exe).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      HAS_CERT: ${{ secrets.MACOS_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the build number counts commits
      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2

      - name: Import the signing certificate
        if: env.HAS_CERT == 'true'
        env:
          CERT: ${{ secrets.MACOS_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$CERT" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | grep "Developer ID Application" | head -1 | awk '{print $2}')
          echo "TIDY_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Build the universal app and package it (.dmg, .zip)
        env:
          # Anonymous telemetry (see README, "Telemetry"); without the secret the build sends nothing.
          TIDY_APTABASE_KEY: ${{ secrets.APTABASE_APP_KEY }}
        run: |
          brew install create-dmg
          scripts/package-mac.sh

      - name: Notarize
        if: env.HAS_CERT == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          DMG=$(ls dist/*.dmg)
          xcrun notarytool submit "$DMG" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "$DMG"
          # What a Mac checks when someone opens the download: it should say "Notarized Developer ID".
          spctl --assess --type open --context context:primary-signature --verbose=2 "$DMG"
          # The app inside was notarized with the image: staple it too, and zip it again.
          xcrun stapler staple target/Tidy.app
          spctl --assess --type execute --verbose=2 target/Tidy.app
          ZIP=$(ls dist/*.zip)
          rm "$ZIP" && ditto -c -k --keepParent target/Tidy.app "$ZIP"
          (cd dist && shasum -a 256 *.dmg *.zip > "$(basename "${DMG%.dmg}").sha256")

      - name: Release notes
        run: |
          DMG=$(basename "$(ls dist/*.dmg)")
          if [ "$HAS_CERT" = "true" ]; then
            OPEN="Open **Tidy** from Applications."
          else
            OPEN="This build isn't notarized yet: the first time, open **Tidy** from Applications, then go to **System Settings › Privacy & Security** and click **Open Anyway**."
          fi
          cat > "$RUNNER_TEMP/notes.md" <<NOTES
          ## Install

          1. Download **[$DMG](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$DMG)** (Apple silicon and Intel, macOS 13+).
          2. Open it and drag **Tidy** into **Applications**.

          **Windows:** download **Tidy-…-windows-x64-setup.exe** (or **arm64** for Windows on ARM) and run it. It installs for you only, no administrator needed, with a Start menu shortcut. A portable .zip is attached too.
          3. $OPEN
          4. When Tidy asks, turn on **Full Disk Access** once, so it can measure every folder.

          The assistant uses Claude Code, Codex or Gemini CLI if one is installed and signed in.
          NOTES
          sed -i '' 's/^          //' "$RUNNER_TEMP/notes.md"

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          body_path: ${{ runner.temp }}/notes.md
          generate_release_notes: true
          files: |
            dist/*.dmg
            dist/*.zip
            dist/*.sha256

  windows:
    name: Windows (${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x64, arm64]
    env:
      SIGN: ${{ secrets.SIGNPATH_API_TOKEN != '' && vars.SIGNPATH_ORGANIZATION_ID != '' }}
      TARGET: ${{ matrix.arch == 'arm64' && 'aarch64-pc-windows-msvc' || 'x86_64-pc-windows-msvc' }}
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.arch }}
      - name: Build Tidy.exe
        shell: pwsh
        env:
          TIDY_APTABASE_KEY: ${{ secrets.APTABASE_APP_KEY }}
        run: |
          rustup target add $env:TARGET
          cargo build --release -p tidy --target $env:TARGET
          New-Item -ItemType Directory -Force build | Out-Null
          Copy-Item "target\$env:TARGET\release\tidy.exe" build\Tidy.exe

      # Signing waits for an approver in SignPath (see README, "Code signing policy").
      - name: Upload Tidy.exe for signing
        if: env.SIGN == 'true'
        id: exe
        uses: actions/upload-artifact@v4
        with:
          name: exe-${{ matrix.arch }}
          path: build/Tidy.exe
      - name: Sign Tidy.exe
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: tidy
          signing-policy-slug: release-signing
          artifact-configuration-slug: exe
          github-artifact-id: ${{ steps.exe.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: build

      - name: Build the installer and the portable .zip
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y | Out-Null
          scripts/package-windows.ps1 -Arch ${{ matrix.arch }} -Exe build\Tidy.exe

      - name: Upload the installer for signing
        if: env.SIGN == 'true'
        id: setup
        uses: actions/upload-artifact@v4
        with:
          name: setup-${{ matrix.arch }}
          path: dist/*setup.exe
      - name: Sign the installer
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: tidy
          signing-policy-slug: release-signing
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.setup.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist
      - name: SHA-256 of what's published
        if: env.SIGN == 'true'
        shell: pwsh
        run: |
          $sums = Get-ChildItem dist -Filter "Tidy-*" | Where-Object { $_.Extension -ne '.sha256' } | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          }
          $sums | Set-Content (Get-ChildItem dist -Filter "*.sha256" | Select-Object -First 1).FullName

      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*setup.exe
            dist/*portable.zip
            dist/*.sha256
