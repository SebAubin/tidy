name: Release

# Push a tag like v0.2.0 to build Tidy.app and publish it as a GitHub release.
# With these repository secrets set, the app is signed with Developer ID and notarized, so it opens
# without a Gatekeeper warning; without them it's signed ad hoc (right-click > Open the first time):
#   MACOS_CERTIFICATE        base64 of a Developer ID Application .p12
#   MACOS_CERTIFICATE_PASSWORD
#   APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD   (an app-specific password for notarytool)
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      HAS_CERT: ${{ secrets.MACOS_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the build number counts commits
      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2

      - name: Import the signing certificate
        if: env.HAS_CERT == 'true'
        env:
          CERT: ${{ secrets.MACOS_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$CERT" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | grep "Developer ID Application" | head -1 | awk '{print $2}')
          echo "TIDY_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Build Tidy.app
        run: scripts/bundle-mac.sh

      - name: Notarize
        if: env.HAS_CERT == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          ditto -c -k --keepParent target/Tidy.app "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple target/Tidy.app

      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ditto -c -k --keepParent target/Tidy.app "Tidy-$VERSION-macos-arm64.zip"
          shasum -a 256 "Tidy-$VERSION-macos-arm64.zip" > "Tidy-$VERSION-macos-arm64.zip.sha256"

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Tidy-*-macos-arm64.zip
            Tidy-*-macos-arm64.zip.sha256
          generate_release_notes: true
