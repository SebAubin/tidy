[package]
name = "tidy"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rune.workspace = true
rune-kit.workspace = true
rune-mac.workspace = true
tidy-core = { path = "../crates/tidy-core" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
rayon = "1"
ureq = { version = "2", features = ["json"] }
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString"] }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSResponder", "NSStatusBar", "NSStatusItem", "NSStatusBarButton", "NSButton", "NSControl", "NSView", "NSMenu", "NSMenuItem", "NSImage", "NSCell", "NSRunningApplication"] }
