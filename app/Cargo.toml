[package]
name = "tidy"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
winresource = "0.1"

[dependencies]
rune.workspace = true
rune-kit.workspace = true
rune-mac.workspace = true
tidy-core = { path = "../crates/tidy-core" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
rayon = "1"
# The system's own TLS (Schannel, Security.framework): no C toolchain needed, the system's certificates.
ureq = { version = "2", default-features = false, features = ["json", "native-tls"] }
native-tls = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSArray"] }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSResponder", "NSStatusBar", "NSStatusItem", "NSStatusBarButton", "NSButton", "NSControl", "NSView", "NSMenu", "NSMenuItem", "NSImage", "NSCell", "NSRunningApplication"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_System_LibraryLoader"] }
raw-window-handle = "0.6"
